name: Refresh animated header GIF
on:
  push:
    paths:
      - '.github/workflows/refresh-header-gif.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render smooth terminal animation
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, math
          W,H=1200,370
          ff='/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'
          fb='/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf'
          def font(sz,b=False): return ImageFont.truetype(fb if b else ff,sz)
          # Ease pauses and a slightly irregular but steady keystroke rhythm.
          def typed(s,t,start,seconds):
              if t < start:return ''
              z=max(0,min(1,(t-start)/seconds))
              return s[:min(len(s),int(z*len(s)+0.0001))]
          def cursor(draw,x,y,visible=True):
              if visible: draw.rectangle((x,y,x+9,y+19),fill='#B7FF48')
          frames=[]
          role='Frontend Engineer'
          stack='> Angular  /  React  /  Next.js  /  TypeScript'
          code=['const focus = {','  ui: "accessible",','  code: "clean",','  dx: "thoughtful",','  product: "first"','};']
          fps=12
          count=124
          for k in range(count):
              t=k/fps
              im=Image.new('RGB',(W,H),'#080D0C')
              d=ImageDraw.Draw(im)
              d.rounded_rectangle((2,2,W-3,H-3),radius=20,outline='#294638',width=2)
              d.rounded_rectangle((26,22,1174,348),radius=13,fill='#0D1513',outline='#365446',width=2)
              d.line((26,68,1174,68),fill='#2C4C3D',width=2)
              for x,c in [(53,'#F47878'),(77,'#F7CB6D'),(101,'#7AD99B')]: d.ellipse((x-7,41,x+7,55),fill=c)
              d.text((440,41),'jeferson@frontend: ~/profile.ts',font=font(13),fill='#91A99E')
              d.text((65,92),'$ whoami',font=font(18),fill='#B7FF48')
              d.text((62,128),'Jeferson Santana',font=font(50,True),fill='#F3F7F4')
              r=typed(role,t,0.7,2.0)
              s=typed(stack,t,3.0,2.9)
              d.text((66,204),r,font=font(22,True),fill='#B7FF48')
              if t>=3.0:
                  d.text((66,254),s,font=font(15),fill='#9ED9CE')
              show_cursor=(int(t*2.2)%2==0)
              if t<3.0:
                  x=66+int(d.textlength(r,font=font(22,True)))+5
                  cursor(d,x,208,show_cursor)
              else:
                  x=66+int(d.textlength(s,font=font(15)))+5
                  cursor(d,x,254,show_cursor)
              d.text((66,316),'architecture  ·  testing  ·  performance',font=font(12),fill='#6F9885')
              d.rounded_rectangle((824,94,1128,305),radius=10,fill='#0A110F',outline='#244235',width=2)
              d.text((845,116),'// focus.ts',font=font(14),fill='#719B89')
              for j,line in enumerate(code):
                  # Staggered line reveal: each line types over 0.65 s, rather than popping.
                  val=typed(line,t,1.0+j*0.87,0.73)
                  if not val: continue
                  y=151+j*24
                  d.text((843,y),f'{j+1:02}',font=font(12),fill='#446A57')
                  d.text((874,y),val,font=font(12),fill='#9ED9CE' if j in (1,2,3,4) else '#F3F7F4')
              frames.append(im.quantize(colors=80,method=Image.Quantize.MEDIANCUT))
          os.makedirs('assets',exist_ok=True)
          frames[0].save('assets/header-terminal-animated.gif',save_all=True,append_images=frames[1:],duration=83,loop=0,optimize=True,disposal=2)
          print('Saved GIF:',os.stat('assets/header-terminal-animated.gif').st_size,'bytes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header-terminal-animated.gif
          git commit -m "style(profile): smooth terminal GIF animation"
          git push
